[__config__]
oldver = "old_ver.json"
newver = "new_ver.json"

["sys-kernel/cachyos-settings"]
source = "github"
github = "CachyOS/CachyOS-Settings"
use_latest_release = true

["sys-kernel/cachyos-sources"]
source = "github"
github = "CachyOS/linux-cachyos"
use_latest_release = true

["app-emulation/wine-osu"]
source = "github"
github = "whrvt/wine-osu-patches"
use_max_tag = true
include_regex = 'winello-v[0-9]+\.[0-9]+-[0-9]+'
prefix = "winello-v"
from_pattern = '-1$'
to_pattern = ""

["x11-misc/flatpak-xdg-utils"]
source = "github"
github = "flatpak/flatpak-xdg-utils"
use_latest_release = true
